# Temporary (feature branch only, removed before merge): posts typecheck / lint / test / build
# output to the pull request so failures can be read without access to the Actions logs.
name: Branch report (temporary)
on:
  push:
    branches: [feat/month-end-default]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: branch-report
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: checks
        run: |
          set +e
          npx tsc -b > tsc.txt 2>&1; echo "exit $?" >> tsc.txt
          npx oxlint --deny-warnings > lint.txt 2>&1; echo "exit $?" >> lint.txt
          npx vitest run --silent --reporter=dot > test.txt 2>&1; echo "exit $?" >> test.txt
          npx vite build > build.txt 2>&1; echo "exit $?" >> build.txt
          true
      - name: post
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          strip() { sed -r 's/\x1b\[[0-9;]*m//g'; }
          {
            echo "### ${GITHUB_SHA::7}"
            echo '#### typecheck'; echo '```'; strip < tsc.txt | head -80; echo '```'
            echo '#### lint'; echo '```'; strip < lint.txt | tail -60; echo '```'
            echo '#### tests'; echo '```'; strip < test.txt | grep -v '^\s*$' | grep -Ev '^[·.x*-]+$' | tail -150; echo '```'
            echo '#### build'; echo '```'; strip < build.txt | tail -12; echo '```'
          } > body.md
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:feat/month-end-default&state=open" --jq '.[0].number')
          [ -n "$PR" ] && gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@body.md --jq .html_url
